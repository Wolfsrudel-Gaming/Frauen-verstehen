name: Android APK

on:
  workflow_dispatch:
  push:
    branches: ["claude/**", main]
    paths:
      - "apps/mobile/**"
      - ".github/workflows/android-apk.yml"

jobs:
  apk:
    name: Build release APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      # Signed with the debug keystore (see android/app/build.gradle.kts) —
      # installable on any device for testing, not for Play Store upload.
      - run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: driver-analytics-apk
          path: apps/mobile/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
